<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy — Safdie Consulting</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/tokens/colors.css">
  <link rel="stylesheet" href="_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/tokens/typography.css">
  <link rel="stylesheet" href="_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/tokens/motion.css">
  <link rel="stylesheet" href="_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/tokens/base.css">
  <link rel="stylesheet" href="_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/styles.css">
  <script src="_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/_ds_bundle.js"></script>
  <style>
    body { margin: 0; }
    a { color: var(--text-accent); text-decoration: none; }
    a:hover { color: var(--sc-ink); }
    :focus-visible { outline: 2px solid var(--surface-accent); outline-offset: 2px; }
  </style>
</helmet>
<div style="background: var(--surface-page); color: var(--text-body); min-height: 100vh; --radius-control: var(--radius-full); --radius-surface: 20px;">
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">

  <x-import component-from-global-scope="SafdieConsultingDesignSystem_742842.NavBar" from="./_ds/safdie-consulting-design-system-742842e8-c833-4688-951a-4af33e768d42/_ds_bundle.js" links="{{ C.nav }}" cta="{{ navCta }}" hint-size="100%,74px"></x-import>

  <main style="padding: var(--space-6) var(--page-margin) var(--space-6); box-sizing: border-box; max-width: 900px; margin: 0 auto;">
    <a href="Home.dc.html" style="font-family: var(--font-mono); font-size: 13px; color: var(--text-muted);">{{ C.backLink }}</a>
    <div style="margin-top: 26px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 28px; height: 1px; background: var(--surface-accent);"></div>
      <x-import component-from-global-scope="SafdieConsultingDesignSystem_742842.Eyebrow" hint-size="auto,20px">{{ C.legalEyebrow }}</x-import>
    </div>
    <h1 style="margin: 18px 0 0; font-size: 48px; line-height: 1.1; letter-spacing: -0.035em; font-weight: var(--weight-semibold);">{{ C.privacy.title }}</h1>
    <div style="margin-top: 12px; font-family: var(--font-mono); font-size: 13px; color: var(--text-muted);">{{ C.privacy.updated }}</div>
    <p style="margin-top: 30px; font-size: var(--size-body); line-height: var(--lh-body); color: var(--text-secondary);">{{ C.privacy.intro }}</p>

    <div style="margin-top: var(--space-5);">
      <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="7">
        <div style="border-top: 1px solid var(--rule); padding: var(--space-4) 0;">
          <h2 style="margin: 0; font-size: var(--size-h3); line-height: 1.25; letter-spacing: var(--track-h3); font-weight: var(--weight-semibold);">{{ sec.title }}</h2>
          <div style="margin-top: 16px; display: grid; gap: 14px;">
            <sc-for list="{{ sec.rows }}" as="row" hint-placeholder-count="2">
              <p style="margin: 0; font-size: var(--size-body); line-height: var(--lh-body); color: var(--text-secondary);">
                <sc-if value="{{ row.label }}">
                  <strong style="color: var(--text-body); font-weight: var(--weight-semibold);">{{ row.label }} </strong>
                </sc-if>{{ row.text }}
              </p>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </main>

  <footer style="background: var(--surface-inverse); color: var(--text-on-inverse); padding: var(--space-5) var(--page-margin); box-sizing: border-box;">
    <div style="display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; align-items: center;">
      <x-import component-from-global-scope="SafdieConsultingDesignSystem_742842.Logo" size="{{ 36 }}" tone="paper" hint-size="36px,36px"></x-import>
      <div style="font-family: var(--font-mono); font-size: 11.5px; color: var(--sc-paper-45);">{{ C.footer.note }}</div>
    </div>
  </footer>
</sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'en', EN: null, ES: null };

  componentDidMount() {
    import('./site-content.js').then((mod) => this.setState({ EN: mod.EN, ES: mod.ES }));
    try {
      const l = window.localStorage.getItem('sc_site_lang');
      if (l === 'es' || l === 'en') this.setState({ lang: l });
    } catch (e) {}
  }

  renderVals() {
    const lang = this.state.lang;
    const C = lang === 'es' ? this.state.ES : this.state.EN;
    if (!C) return { ready: false, C: null };

    const sections = C.privacy.sections.map((sec) => ({
      title: sec.title,
      rows: sec.rows.map(([label, text]) => ({ label, text })),
    }));

    return {
      ready: true,
      C,
      sections,
      navCta: { label: C.navCtaLabel, href: 'Home.dc.html#contact' },
    };
  }
}

</script>
</body>
</html>
